###############################################################################
# HiClippy monitoring (docs/plan-ops.md, Phase 2)
#
# Hosts and expected values match ops/terraform (its outputs: site_url,
# api_health_url, dns_records). Phase 3 generates this part from them.
#
# Soft vs hard states: a check that fails once is SOFT (could be a blip).
# It is retried every minute, and only after 3 failures in a row does it
# become HARD and send an alert. Healthy checks run every 5 minutes, which
# also keeps the free Render API awake.
###############################################################################


# ── Contacts: alerts go to a log file the host can follow ──────────────────

define command {
    command_name    notify-host-by-log
    command_line    /usr/bin/printf "%s | HOST %s is %s (%s) | %s\n" "$LONGDATETIME$" "$HOSTNAME$" "$HOSTSTATE$" "$NOTIFICATIONTYPE$" "$HOSTOUTPUT$" >> /var/log/hiclippy-alerts/alerts.log
}

define command {
    command_name    notify-service-by-log
    command_line    /usr/bin/printf "%s | %s on %s is %s (%s) | %s\n" "$LONGDATETIME$" "$SERVICEDESC$" "$HOSTNAME$" "$SERVICESTATE$" "$NOTIFICATIONTYPE$" "$SERVICEOUTPUT$" >> /var/log/hiclippy-alerts/alerts.log
}

define contact {
    contact_name                    hiclippy-admin
    alias                           HiClippy admin
    host_notifications_enabled      1
    service_notifications_enabled   1
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r,f,s
    service_notification_options    w,u,c,r,f,s
    host_notification_commands      notify-host-by-log
    service_notification_commands   notify-service-by-log
}

define contactgroup {
    contactgroup_name   hiclippy-admins
    alias               HiClippy admins
    members             hiclippy-admin
}


# ── Templates ──────────────────────────────────────────────────────────────

define host {
    name                    hiclippy-host
    use                     generic-host
    check_command           check-host-https
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    contact_groups          hiclippy-admins
    register                0
}

define service {
    name                    hiclippy-service
    use                     generic-service
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    contact_groups          hiclippy-admins
    register                0
}


# ── Commands ───────────────────────────────────────────────────────────────

# Host is up if it answers HTTPS with any status (the apex answers 308).
define command {
    command_name    check-host-https
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -t 30 -e 'HTTP/'
}

# Page loads over HTTPS with the expected text.
# ARG1 path, ARG2 text that must appear, ARG3 warn seconds, ARG4 crit seconds
define command {
    command_name    check-https-content
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -u '$ARG1$' -s '$ARG2$' -w $ARG3$ -c $ARG4$ -t 60
}

# Response has the expected HTTP status (e.g. a 308 redirect) and Location.
# ARG1 expected status code, ARG2 text that must appear in the headers
define command {
    command_name    check-https-redirect
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -u / -e '$ARG1$' -d '$ARG2$' -t 30
}

# Days until the HTTPS certificate expires. ARG1 warn days, ARG2 crit days
define command {
    command_name    check-https-cert
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -C $ARG1$,$ARG2$ -t 30
}

# A DNS record still has the expected value, asked of a public resolver.
# ARG1 name, ARG2 record type, ARG3 expected answer
define command {
    command_name    check-dns-record
    command_line    $USER1$/check_dig -H 1.1.1.1 -l '$ARG1$' -T $ARG2$ -a '$ARG3$'
}

# Custom: share a clip through the API, read it back, delete it.
# ARG1 API base URL, ARG2 warn seconds, ARG3 crit seconds
define command {
    command_name    check-hiclippy-roundtrip
    command_line    $USER1$/check_hiclippy_roundtrip.py --api '$ARG1$' -w $ARG2$ -c $ARG3$ -t 90
}


# ── Hosts ──────────────────────────────────────────────────────────────────

define hostgroup {
    hostgroup_name  hiclippy
    alias           HiClippy (frontend and API)
}

define host {
    use             hiclippy-host
    host_name       www.hiclippy.online
    alias           HiClippy website (Vercel)
    address         www.hiclippy.online
    hostgroups      hiclippy
    notes_url       https://www.hiclippy.online
}

define host {
    use             hiclippy-host
    host_name       hiclippy.online
    alias           Bare domain, redirects to www (Vercel)
    address         hiclippy.online
    hostgroups      hiclippy
}

define host {
    use             hiclippy-host
    host_name       clippy-api.onrender.com
    alias           HiClippy API (Render, free plan)
    address         clippy-api.onrender.com
    hostgroups      hiclippy
    notes_url       https://clippy-api.onrender.com/health
}


# ── Services: website ──────────────────────────────────────────────────────

define service {
    use                     hiclippy-service
    host_name               www.hiclippy.online
    service_description     Homepage
    # The site is a single-page app: the server's HTML carries the title,
    # not the page text (React adds that), so match the name in <title>.
    check_command           check-https-content!/!<title>HiClippy!2!5
}

define service {
    use                     hiclippy-service
    host_name               www.hiclippy.online
    service_description     Share page
    check_command           check-https-content!/share!HiClippy!2!5
}

define service {
    use                     hiclippy-service
    host_name               www.hiclippy.online
    service_description     HTTPS certificate
    check_command           check-https-cert!30!7
    check_interval          360
    notification_interval   360
}

define service {
    use                     hiclippy-service
    host_name               www.hiclippy.online
    service_description     DNS www CNAME to Vercel
    check_command           check-dns-record!www.hiclippy.online!CNAME!24248e9bbfc864fb.vercel-dns-017.com
    check_interval          30
}


# ── Services: bare domain ──────────────────────────────────────────────────

define service {
    use                     hiclippy-service
    host_name               hiclippy.online
    service_description     Redirect to www
    check_command           check-https-redirect!308!Location: https://www.hiclippy.online/
}

define service {
    use                     hiclippy-service
    host_name               hiclippy.online
    service_description     DNS A record to Vercel
    check_command           check-dns-record!hiclippy.online!A!216.198.79.1
    check_interval          30
}


# ── Services: API ──────────────────────────────────────────────────────────

# /health must say healthy. Thresholds allow for a Render cold start.
define service {
    use                     hiclippy-service
    host_name               clippy-api.onrender.com
    service_description     API health
    check_command           check-https-content!/health!"status":"healthy"!3!15
}

define service {
    use                     hiclippy-service
    host_name               clippy-api.onrender.com
    service_description     HTTPS certificate
    check_command           check-https-cert!30!7
    check_interval          360
    notification_interval   360
}

# Saves a tiny clip that expires in 1 minute and deletes it right away.
# Every 15 minutes is 4 uploads an hour, far under the API's limit of 20.
define service {
    use                     hiclippy-service
    host_name               clippy-api.onrender.com
    service_description     Share and retrieve a clip
    check_command           check-hiclippy-roundtrip!https://clippy-api.onrender.com!10!30
    check_interval          15
}
