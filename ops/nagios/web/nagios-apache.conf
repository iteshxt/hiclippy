# Nagios web interface with a normal login page.
#
# Replaces the stock config from `make install-webconf`, which uses HTTP
# Basic auth: browsers increasingly refuse to show that popup on plain
# http:// (and extensions or security software can block it), leaving a
# bare "401 Unauthorized". This uses an HTML form instead (mod_auth_form)
# with the same htpasswd file, and keeps the login in an encrypted,
# HttpOnly session cookie. Nagios still sees the user as REMOTE_USER.

ScriptAlias /nagios/cgi-bin "/usr/local/nagios/sbin"
Alias /nagios "/usr/local/nagios/share"

<Directory "/usr/local/nagios/sbin">
    Options ExecCGI
    AllowOverride None
</Directory>

<Directory "/usr/local/nagios/share">
    Options None
    AllowOverride None
</Directory>

# Everything under /nagios needs a logged-in session.
<Location "/nagios">
    AuthType form
    AuthName "Nagios"
    AuthFormProvider file
    AuthUserFile /usr/local/nagios/etc/htpasswd.users
    AuthFormLoginRequiredLocation "/login.html"
    Session On
    SessionCookieName nagios_session path=/;HttpOnly;SameSite=Strict
    SessionCryptoPassphrase ${NAGIOS_SESSION_SECRET}
    SessionMaxAge 43200
    Require valid-user
</Location>

# The login form posts here.
<Location "/dologin">
    SetHandler form-login-handler
    AuthType form
    AuthName "Nagios"
    AuthFormProvider file
    AuthUserFile /usr/local/nagios/etc/htpasswd.users
    AuthFormLoginRequiredLocation "/login.html?failed=1"
    AuthFormLoginSuccessLocation "/nagios/"
    Session On
    SessionCookieName nagios_session path=/;HttpOnly;SameSite=Strict
    SessionCryptoPassphrase ${NAGIOS_SESSION_SECRET}
    SessionMaxAge 43200
</Location>

<Location "/logout">
    SetHandler form-logout-handler
    AuthFormLogoutLocation "/login.html?loggedout=1"
    Session On
    SessionCookieName nagios_session path=/;HttpOnly;SameSite=Strict
    SessionCryptoPassphrase ${NAGIOS_SESSION_SECRET}
    SessionMaxAge 1
</Location>

# The bare address opens the dashboard (or the login page first).
RedirectMatch ^/$ /nagios/
