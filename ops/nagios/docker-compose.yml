# Run from ops/nagios:
#   docker compose --env-file ../../.env.local up -d --build
# Web interface: http://localhost:8080/nagios  (user nagiosadmin)
name: hiclippy-nagios

services:
  nagios:
    build:
      context: .
      # The login page uses the site's own logo and mascot, taken straight
      # from frontend/public so there is one copy of each.
      additional_contexts:
        site: ../../frontend/public
    image: hiclippy-nagios:4.5.14
    container_name: hiclippy-nagios
    ports:
      # Only reachable from this laptop, never from the network.
      - "127.0.0.1:8080:80"
    environment:
      TZ: Asia/Kolkata
      NAGIOS_ADMIN_USER: ${NAGIOS_ADMIN_USER:-nagiosadmin}
      # Read from the repo-root .env.local (gitignored); entrypoint.sh refuses
      # to start without it.
      NAGIOS_ADMIN_PASSWORD: ${NAGIOS_ADMIN_PASSWORD}
    volumes:
      # Check history, comments, downtime and logs survive restarts.
      - nagios_var:/usr/local/nagios/var
      # The HiClippy checks, generated by Terraform. The folder (not the file)
      # is mounted: Terraform replaces the file, and a single-file mount
      # would keep showing the old one.
      - ./etc:/usr/local/nagios/etc/hiclippy:ro
      # Alerts land in ./alerts/alerts.log (followed by watch-alerts.sh).
      - ./alerts:/var/log/hiclippy-alerts
    restart: unless-stopped

volumes:
  nagios_var:
